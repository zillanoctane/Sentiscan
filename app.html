<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sentiscan — Aplikasi Analisis Sentimen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f4f1ea;
    --bg-2: #ece8df;
    --ink: #14110d;
    --ink-2: #3a342b;
    --muted: #847c6f;
    --line: #d9d2c3;
    --line-strong: #c4bba8;
    --pos: #2a7a52;
    --pos-soft: #d9ead8;
    --neg: #b53a2a;
    --neg-soft: #f3d9cf;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: 'Geist', system-ui, -apple-system, sans-serif;
    font-feature-settings: 'ss01', 'ss02', 'cv11';
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .serif { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; }
  a { color: inherit; }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; }
  ::selection { background: var(--ink); color: var(--bg); }
  /* range input baseline */
  input[type="range"] { height: 6px; }

  /* table sticky header behaves nice */
  table { background: var(--bg-2); }

  /* ───────────────────────── RESPONSIVE LAYER ─────────────────────────
     Tampilan desktop tidak berubah; aturan di bawah hanya aktif saat
     lebar layar mengecil, agar konten tidak terpotong di tepi kanan. */

  /* Cegah scroll horizontal di seluruh aplikasi */
  html, body { max-width: 100%; overflow-x: hidden; }
  #root { width: 100%; }
  img, svg, canvas, table { max-width: 100%; }

  /* Tablet & layar sempit: grid 2/3/4 kolom -> tumpuk jadi 1 kolom.
     Menargetkan grid inline-style di dalam area konten utama. */
  @media (max-width: 1024px) {
    .app-main [style*="grid-template-columns"] {
      grid-template-columns: 1fr !important;
    }
    /* baris statistik tetap multi-kolom tapi rapat */
    .app-main .stat-row[style*="grid-template-columns"] {
      grid-template-columns: repeat(2, 1fr) !important;
      row-gap: 16px !important;
    }
  }

  /* Layar HP: rapikan padding & elemen baris */
  @media (max-width: 720px) {
    .app-main .app-pad { padding-left: 16px !important; padding-right: 16px !important; }
    .app-topbar { padding-left: 16px !important; padding-right: 16px !important; gap: 12px !important; }
    .app-main .stat-row[style*="grid-template-columns"] {
      grid-template-columns: 1fr 1fr !important;
    }
    /* tabel lebar bisa digeser, tidak memaksa layout melebar */
    .app-main .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    /* sembunyikan kotak pencarian agar topbar tidak sesak */
    .app-search { display: none !important; }
  }

  /* Sidebar geser (off-canvas) di layar sempit */
  @media (max-width: 900px) {
    .app-sidebar {
      position: fixed !important;
      left: 0; top: 0;
      z-index: 60;
      transform: translateX(-100%);
      transition: transform .22s ease;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0);
    }
    .app-sidebar.open {
      transform: translateX(0);
      box-shadow: 0 0 40px rgba(20,17,13,0.18);
    }
    .app-scrim {
      position: fixed; inset: 0; z-index: 55;
      background: rgba(20,17,13,0.32);
      opacity: 0; pointer-events: none;
      transition: opacity .22s ease;
    }
    .app-scrim.show { opacity: 1; pointer-events: auto; }
    .app-burger { display: flex !important; }
  }
  @media (min-width: 901px) {
    .app-burger { display: none !important; }
    .app-scrim { display: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="src/app-data.js"></script>
<script type="text/babel" src="src/app-charts.jsx"></script>
<script type="text/babel" src="src/app-shell.jsx"></script>
<script type="text/babel" src="src/page-dashboard.jsx"></script>
<script type="text/babel" src="src/page-dataset.jsx"></script>
<script type="text/babel" src="src/page-praproses.jsx"></script>
<script type="text/babel" src="src/page-pemodelan.jsx"></script>
<script type="text/babel" src="src/page-hasil.jsx"></script>
<script type="text/babel" src="src/page-prediksi.jsx"></script>
<script type="text/babel" src="src/page-riwayat.jsx"></script>
<script type="text/babel" src="src/page-profil.jsx"></script>
<script type="text/babel" src="src/app-main.jsx"></script>
</body>
</html>
