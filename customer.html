<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sentiscan — Portal Pelanggan</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f4f1ea; --bg-2: #ece8df;
    --ink: #14110d; --ink-2: #3a342b; --muted: #847c6f;
    --line: #d9d2c3; --line-strong: #c4bba8;
    --pos: #2a7a52; --pos-soft: #d9ead8;
    --neg: #b53a2a; --neg-soft: #f3d9cf;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: 'Geist', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .serif { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; }
  ::selection { background: var(--ink); color: var(--bg); }

  /* ───── Responsive: layar sempit ───── */
  html, body { max-width: 100%; overflow-x: hidden; }
  img, svg, canvas, table { max-width: 100%; }
  @media (max-width: 1024px) {
    /* grid multi-kolom -> 1 kolom di area konten */
    .cust-main [style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
    /* kartu produk tetap 2 kolom agar tidak terlalu kosong */
    .cust-main .prod-grid[style*="grid-template-columns"] { grid-template-columns: repeat(2, 1fr) !important; }
    /* baris statistik kecil tetap multi-kolom */
    .cust-main .stat-row[style*="grid-template-columns"] { grid-template-columns: repeat(3, 1fr) !important; }
  }
  @media (max-width: 720px) {
    .cust-main { padding-left: 16px !important; padding-right: 16px !important; }
    .cust-head { padding-left: 16px !important; padding-right: 16px !important; gap: 14px !important; }
    .cust-main .prod-grid[style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="src/app-data.js"></script>
<script type="text/babel" src="src/app-charts.jsx"></script>
<script type="text/babel" src="src/customer-app.jsx"></script>
<script type="text/babel">
  ReactDOM.createRoot(document.getElementById("root")).render(<CustomerApp />);
</script>
</body>
</html>
